{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
{{ heading('Settings', 'Web access and administrator settings.', 'ttui ' ~ version) }}
<section class="card">
  <form class="stack" method="post" action="{{ url_for('save_settings') }}">
    {{ token() }}
    <div class="grid">
      <label>Panel path <input name="path" value="{{ config.path or '/' }}" required spellcheck="false"></label>
      <label>Public TrustTunnel address <input name="address" value="{{ config.address }}" placeholder="vpn.example.com:443"></label>
      <label>Username <input name="username" value="{{ config.username }}" autocomplete="username" maxlength="64" required></label>
      <label>New password <input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" placeholder="Leave blank to keep the current password"></label>
    </div>
    <label class="check"><input name="secure_cookie" type="checkbox" {% if config.secure_cookie or https_required %}checked{% endif %} {% if https_required %}disabled{% endif %}> Send cookies over HTTPS only</label>
    <div class="row separate">
      <label>Current password <input type="password" name="current_password" autocomplete="current-password" maxlength="256" required></label>
      <button class="primary">Save settings</button>
    </div>
  </form>
</section>
<section class="card stack">
  <h2>Sessions</h2>
  <form class="row" method="post" action="{{ url_for('revoke_sessions') }}">
    {{ token() }}
    <label>Current password <input type="password" name="current_password" required maxlength="256" autocomplete="current-password"></label>
    <button class="danger">Sign out all sessions</button>
  </form>
</section>
{% endblock %}
