{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="card login-card">
  <p class="brand">ttui</p>
  <h1>Вход в панель</h1>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form class="stack" method="post" action="{{ url_for('login') }}">
    {{ token() }}
    <label>Логин <input name="username" autocomplete="username" required maxlength="64" autofocus></label>
    <label>Пароль <input type="password" name="password" autocomplete="current-password" required maxlength="256"></label>
    <button class="primary">Войти</button>
  </form>
</section>
{% endblock %}
