{% extends "base.html" %}
{% block title %}Diagnostics{% endblock %}
{% block content %}
{{ heading('Diagnostics', 'Check service health, settings, and local connectivity.') }}
<section class="card stack">
  <form method="post">{{ token() }}<button class="primary">Run diagnostics</button></form>
  {% for status, name, detail in rows %}
  <article class="journal-entry">
    <strong>{{ name }}</strong> <span class="status{% if status == 'OK' %} online{% elif status == 'Attention' %} danger{% endif %}">{{ status }}</span>
    <p class="subtle">{{ detail }}</p>
  </article>
  {% endfor %}
</section>
{% endblock %}
