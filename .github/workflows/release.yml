name: Release
'on':
  push:
    tags: ['[0-9][0-9].[0-9][0-9].[0-9][0-9]']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag named by publication date, for example 26.11.26
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The version is the publication date: YY.MM.DD, tagged on the day of publishing.
          [[ $RELEASE_TAG == "$(date -u +%y.%m.%d)" ]]
          git merge-base --is-ancestor HEAD origin/dev
          bash scripts/package.sh "$RELEASE_TAG"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Test the minified sources that ship in the archive
        run: |
          python3 scripts/minify.py . "$RUNNER_TEMP/minified"
          cp VERSION requirements.txt "$RUNNER_TEMP/minified/"
          (cd "$RUNNER_TEMP/minified" && python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v)
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Build and exercise release assets
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          bash scripts/package.sh "$RELEASE_TAG"
          bash scripts/smoke-install.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes_file="$RUNNER_TEMP/ttui-release-notes.md"
          awk -v heading="## ${RELEASE_TAG}" '
            $0 == heading { active = 1; next }
            active && /^## / { exit }
            active { print }
          ' CHANGELOG.md > "$notes_file"
          notes=(--generate-notes)
          if grep -q '[^[:space:]]' "$notes_file"; then notes=(--notes-file "$notes_file"); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" "${notes[@]}" \
            dist/ttui.tar.xz dist/ttui.tar.xz.sha256 dist/bootstrap.sh dist/release-info.json
