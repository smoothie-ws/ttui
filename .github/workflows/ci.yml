name: CI
'on':
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q ./*.py
      - run: |
          bash -n install.sh
          bash -n scripts/package.sh
          bash -n scripts/smoke-install.sh
          node --check static/panel.js
          node --check static/routing.js
          node --check static/xray-outbound.js
          node --check static/monitoring.js
          node --check static/logs.js
          git show --format= --check HEAD
      - name: Check removed installer option
        run: |
          if bash install.sh --panel-only >/dev/null 2>&1; then
            echo "--panel-only must fail with a migration hint"
            exit 1
          fi
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install browser test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ttui-browser"
          "$RUNNER_TEMP/ttui-browser/bin/pip" install playwright==1.65.1
          "$RUNNER_TEMP/ttui-browser/bin/python" -m playwright install --with-deps chromium
      - run: bash scripts/package.sh
      - run: bash scripts/smoke-install.sh
        env:
          TTUI_BROWSER_PYTHON: ${{ runner.temp }}/ttui-browser/bin/python
  upgrade-from-stable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the published release and upgrade
        run: bash scripts/smoke-upgrade-v0.1.sh
  https-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify HTTPS sign-in through Caddy
        run: bash scripts/smoke-https.sh
