name: CI
'on':
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py auth.py backend.py certificates.py client_manager.py endpoint_settings.py monitoring.py routing.py
      - run: |
          bash -n install.sh
          bash -n scripts/package.sh
          bash -n scripts/smoke-install.sh
          node --check static/panel.js
          node --check static/routing.js
          git show --format= --check HEAD
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash scripts/package.sh
      - run: bash scripts/smoke-install.sh
